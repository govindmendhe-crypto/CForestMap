<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#forestGrad)" />
  
  <!-- Outer border -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#10b981" stroke-width="8" opacity="0.4" />
  
  <!-- Forestry Survey Grid Lines -->
  <g stroke="#34d399" stroke-width="4" opacity="0.35">
    <line x1="80" y1="140" x2="432" y2="140" />
    <line x1="80" y1="200" x2="432" y2="200" />
    <line x1="80" y1="260" x2="432" y2="260" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="80" y1="380" x2="432" y2="380" />
    
    <line x1="140" y1="80" x2="140" y2="432" />
    <line x1="200" y1="80" x2="200" y2="432" />
    <line x1="260" y1="80" x2="260" y2="432" />
    <line x1="320" y1="80" x2="320" y2="432" />
    <line x1="380" y1="80" x2="380" y2="432" />
  </g>

  <!-- Baseline (Red) -->
  <line x1="80" y1="260" x2="432" y2="260" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
  
  <!-- Coupe Polygon Perimeter -->
  <polygon points="120,380 100,220 180,120 340,110 410,210 390,360 260,400" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="7" stroke-linejoin="round" />

  <!-- Compass Dial & Needle -->
  <circle cx="256" cy="256" r="82" fill="#064e3b" stroke="#fbbf24" stroke-width="5" />
  <!-- North Arrow Needle -->
  <polygon points="256,182 274,256 256,246" fill="#ef4444" />
  <polygon points="256,182 238,256 256,246" fill="#dc2626" />
  <!-- South Needle -->
  <polygon points="256,330 274,256 256,266" fill="#e2e8f0" />
  <polygon points="256,330 238,256 256,266" fill="#cbd5e1" />
  
  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="10" fill="#fbbf24" />
  
  <!-- "N" Text -->
  <text x="256" y="166" font-family="sans-serif" font-weight="900" font-size="28" fill="#fbbf24" text-anchor="middle">N</text>
</svg>
